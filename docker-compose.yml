services:
  app:
    build: .
    ports: ["8080:80"]
    env_file: .env
    depends_on: [mysql]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sponsor_checker
      MYSQL_USER: sponsor
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes: ["mysql-data:/var/lib/mysql"]
volumes: {mysql-data: {}}
